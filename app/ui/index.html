<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:">
<title>토스 봇</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="mark" id="mark" aria-hidden="true"></span><h1>토스 봇</h1><span class="lamp-txt" id="lamp-txt"></span></div>
  <div class="clock" id="clock" aria-live="polite"></div>
  <div class="wallet" id="wallet"></div>
</header>

<nav class="views" role="tablist" aria-label="화면 고르기">
  <button role="tab" id="view-now" aria-selected="true" data-act="view" data-view="now">지금</button>
  <button role="tab" id="view-league" aria-selected="false" data-act="view" data-view="league">봇 리그</button>
</nav>

<section class="night now-only" id="night" aria-label="오늘 밤 미국장 일정과 봇이 일하는 시간"></section>

<section class="reel now-only" id="reel" aria-label="갭 후보 차트" hidden></section>

<main class="league" id="league" aria-label="봇 리그" hidden>
  <div class="league-head">
    <div><h2>봇 리그</h2><p class="meta" id="league-meta"></p></div>
  </div>
  <div id="league-body"></div>
</main>

<main class="deck now-only">
  <section class="panel held" aria-labelledby="h-held">
    <div class="panel-head"><h2 id="h-held">지금 들고 있는 것</h2></div>
    <div class="panel-body" id="held"></div>
  </section>
  <section class="panel score" aria-labelledby="h-score">
    <div class="panel-head"><h2 id="h-score">봇이 번 돈</h2><span class="meta">갭·애프터장 실전</span></div>
    <div class="panel-body" id="score"></div>
  </section>
  <section class="panel acct" aria-labelledby="h-acct">
    <div class="panel-head"><h2 id="h-acct">계좌</h2><span class="meta" id="acct-meta"></span><button class="btn ghost" data-act="refresh-account" id="acct-refresh">새로고침</button></div>
    <div class="panel-body" id="account"></div>
  </section>
  <section class="panel feed" aria-label="거래와 봇 기록">
    <div class="tabs" role="tablist" id="log-tabs"></div>
    <div class="log-err" id="log-err" hidden></div>
    <div class="panel-body" id="log-body"></div>
  </section>
</main>

<footer class="foot">
  <label class="switch"><input type="checkbox" id="set-login"><span>PC 켤 때 자동으로 켜기</span></label>
  <label class="switch"><input type="checkbox" id="set-notify"><span>체결·청산·오류 알림</span></label>
  <button class="btn ghost" data-act="open" data-what="project">봇 폴더 열기</button>
  <span class="grow"></span>
  <label class="switch danger" title="갭 봇·애프터장 봇이 산 주식을 바로 팔고, 끌 때까지 새로 사지 않아요"><input type="checkbox" id="flag-flatten"><span>봇이 산 주식 지금 다 팔기</span></label>
  <button class="btn" data-act="quit">토스 봇 종료</button>
</footer>
<div class="toast" id="toast" role="status" hidden></div>
<script src="app.js"></script>
</body>
</html>
